databases:
  - name: srsc-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: srsc-backend
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: "npm install && npm run build"
    startCommand: node index.cjs
    healthCheckPath: /api/health
    disk:
      name: srsc-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SQLITE_PATH
        value: /data/data.db
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: srsc-db
          property: connectionString
