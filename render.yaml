databases:
  - name: srsc-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: srsc-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
        buildCommand: npm install && npm run build && npm run db:push
        startCommand: node index.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: srsc-db
          property: connectionString
